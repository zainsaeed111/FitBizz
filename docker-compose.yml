version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fitbizz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitbizz_db
      POSTGRES_USER: fitbizz_user
      POSTGRES_PASSWORD: fitbizz_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitbizz_user -d fitbizz_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FitBizz Spring Boot Backend
  backend:
    build:
      context: ./fitbizz_backend
      dockerfile: Dockerfile
    container_name: fitbizz-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fitbizz_db
      SPRING_DATASOURCE_USERNAME: fitbizz_user
      SPRING_DATASOURCE_PASSWORD: fitbizz_password123
      JWT_SECRET: fitbizz_super_secure_jwt_secret_key_2026_for_cloud_clusters

volumes:
  postgres_data:

server:
  port: ${PORT:8080}

spring:
  application:
    name: fitbizz-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fitbizz_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false

jwt:
  secret: ${JWT_SECRET:c2VjdXJlX2ZpdGJpenpfand0X3NlY3JldF9rZXlfZm9yX2F1dGhlbnRpY2F0aW9uXzIwMjY=}
  expiration: 86400000 # 24 hours in milliseconds

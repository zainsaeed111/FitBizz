services:
  # 1. FitBizz Spring Boot Backend Web Service
  - type: web
    name: fitbizz-backend
    runtime: docker
    dockerContext: ./fitbizz_backend
    dockerfilePath: ./fitbizz_backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: fitbizz-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: fitbizz-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: fitbizz-postgres
          property: password

databases:
  # 2. Free Tier Managed PostgreSQL Database
  - name: fitbizz-postgres
    databaseName: fitbizz_db
    user: fitbizz_admin
    plan: free
    region: oregon
